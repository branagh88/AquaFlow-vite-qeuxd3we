<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaFlow — Professional Field Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Top Header Bar -->
  <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 sticky top-0 z-50 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
      <div class="bg-gradient-to-tr from-blue-600 to-cyan-500 p-2.5 rounded-xl shadow-lg shadow-blue-500/30 flex items-center justify-center text-white">
        <i data-lucide="droplets" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
          AquaFlow <span class="text-xs bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">JS v4.4</span>
        </h1>
        <p class="text-xs text-slate-400">Professional Water Systems Suite</p>
      </div>
    </div>
    <button onclick="switchTab('ai')" class="bg-gradient-to-r from-cyan-600 to-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow">
      AI Diagnostics
    </button>
  </header>

  <!-- Main Container -->
  <main id="app-container" class="flex-1 p-4 md:p-6 max-w-7xl mx-auto w-full pb-20">
    <!-- Dynamic Content -->
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-800 border-t border-slate-700 flex justify-around py-2 px-1 z-50 shadow-2xl">
    <button onclick="switchTab('dashboard')" class="flex flex-col items-center justify-center py-1 px-3 text-blue-400">
      <i data-lucide="wrench" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1">Home</span>
    </button>
    <button onclick="switchTab('calculators')" class="flex flex-col items-center justify-center py-1 px-3 text-slate-400">
      <i data-lucide="calculator" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1">Calcs</span>
    </button>
    <button onclick="switchTab('ai')" class="flex flex-col items-center justify-center py-1 px-3 text-slate-400">
      <i data-lucide="sparkles" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1">AI</span>
    </button>
  </nav>

  <script src="/src/script.js"></script>
</body>
</html>
